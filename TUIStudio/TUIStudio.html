<!DOCTYPE html>
<!-- saved from url=(0019)https://tui.studio/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style data-merge-styles="true"></style>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUIStudio — Design Terminal UIs. Visually.</title>
  <meta name="description" content="A Figma-like visual editor for TUI applications. Drag-and-drop components, edit properties in real-time, and export to 6 frameworks with one click.">
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="./TUIStudio_files/css2" rel="stylesheet">
  <link rel="icon" href="https://tui.studio/assets/favicon_white.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://tui.studio/assets/favicon_dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://tui.studio/assets/favicon_dark.svg">
  <link rel="stylesheet" href="./TUIStudio_files/neon-glass.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #13151f;
      --bg-mid:    #0e1018;
      --bg-card:   #1a1d2a;
      --border:    rgba(255,255,255,0.06);
      --border-hi: rgba(74,222,128,0.40);
      --green:     #4ade80;
      --green-dim: #4a8a58;
      --green-mid: #7dd99a;
      --text-hi:   #eaeef6;
      --text-mid:  #a0aab8;
      --text-dim:  #6b7585;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --font-vt:   'VT323', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #13151f;
      color: var(--text-mid);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* dot-grid canvas background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(140,155,200,0.22) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: repeating-linear-gradient(0deg,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 6px
      );
      pointer-events: none;
    }

    /* ── Helpers ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }
    .eyebrow {
      font-family: var(--font-vt);
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--green-dim);
      margin-bottom: 16px;
    }
    .eyebrow::before { content: '// '; }

    a { color: inherit; text-decoration: none; }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    nav {
      position: sticky; top: 0; z-index: 100;
      height: 58px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      background: rgba(13,15,24,0.90);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { height: 24px; filter: drop-shadow(0 0 6px rgba(74,222,128,0.3)); }
    .alpha-tag {
      font-family: var(--font-vt);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green-mid);
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.35);
      padding: 2px 7px 0;
      line-height: 1.6;
    }
    .hero-glass {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 36px 48px 40px;
      background: rgba(19,21,31,0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 40px rgba(74,222,128,0.06),
        0 24px 64px rgba(0,0,0,0.60);
    }
    .hero-computer {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex; align-items: center; gap: 24px;
    }
    .nav-link {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-mid);
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--text-hi); }

    /* Apple logo glyph */
    .apple-logo {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.1em;
      line-height: 1;
      vertical-align: middle;
      margin-right: 2px;
    }
    .apple-logo::before { content: '\F8FF'; }

    .win-logo {
      font-size: 1em;
      line-height: 1;
      vertical-align: middle;
      margin-right: 3px;
      opacity: 0.9;
    }

    /* ── OS selector ── */
    .os-selector {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      background: rgba(14, 16, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
    }
    .os-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.07em;
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
    }
    .os-tab:hover:not(.active) {
      color: var(--text-mid);
      background: rgba(255, 255, 255, 0.04);
    }
    .os-tab.active {
      color: var(--green);
      background: rgba(74, 222, 128, 0.08);
      border-color: rgba(74, 222, 128, 0.22);
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.12), inset 0 1px 0 rgba(74, 222, 128, 0.08);
    }
    .os-tab[data-os="docker"].active {
      color: #38bdf8;
      background: rgba(36, 150, 237, 0.08);
      border-color: rgba(36, 150, 237, 0.25);
      box-shadow: 0 0 10px rgba(36, 150, 237, 0.15), inset 0 1px 0 rgba(36, 150, 237, 0.08);
    }

    /* small button variant */
    .ng-platform--sm {
      padding: 2px 2px 8px;
      border-radius: 7px;
    }
    .ng-btn--sm {
      font-size: 14px;
      padding: 6px 18px 4px;
      border-radius: 5px;
    }

    /* primary platform — subtle green border glow on nav */
    .ng-platform--primary {
      border-color: rgba(74,222,128,0.40);
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.70),
        inset 0 0  2px rgba(0,0,0,0.40),
        0 0 12px rgba(74,222,128,0.20),
        0 0 24px rgba(74,222,128,0.10);
    }

    /* ══════════════════════════════════════════
       HERO
    ══════════════════════════════════════════ */
    .hero {
      min-height: calc(100vh - 58px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 80px 32px 64px;
      position: relative; z-index: 1;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px 4px;
      border: 1px solid rgba(255,255,255,0.70);
      background: rgba(10,12,20,0.72);
      font-family: var(--font-vt);
      font-size: 15px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 36px;
    }
    .hero-badge-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(74,222,128,0.8);
      animation: blink-dot 1.8s ease-in-out infinite;
    }
    @keyframes blink-dot {
      0%, 100% { opacity: 1; } 50% { opacity: 0.2; }
    }

    .whats-new-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 3px;
      border: 1px solid rgba(74,222,128,0.25);
      background: rgba(74,222,128,0.05);
      font-family: var(--font-vt);
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--text-mid);
      margin-bottom: 20px;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
      border-radius: 3px;
      max-width: 100%;
    }
    .whats-new-badge:hover {
      border-color: rgba(74,222,128,0.45);
      background: rgba(74,222,128,0.09);
    }
    .whats-new-ver { color: var(--green); }
    .whats-new-sep { color: var(--text-dim); }
    .whats-new-change {
      color: var(--text-mid);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }
    .whats-new-arrow { color: var(--green-dim); margin-left: 2px; }

    .hero h1 {
      font-family: var(--font-vt);
      font-size: 32px;
      line-height: 1.0;
      color: var(--text-hi);
      letter-spacing: 0.02em;
      margin-bottom: 28px;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--green);
      text-shadow: 0 0 30px rgba(74,222,128,0.5), 0 0 60px rgba(74,222,128,0.2);
    }
    .cursor {
      display: inline-block;
      width: 0.55em; height: 0.85em;
      background: var(--green);
      vertical-align: baseline;
      margin-left: 4px;
      animation: blink-cursor 1s steps(1) infinite;
      box-shadow: 0 0 12px rgba(74,222,128,0.8);
    }
    @keyframes blink-cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .hero-sub {
      max-width: 560px;
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.8;
      margin: 0 auto 48px;
    }

    .hero-ctas {
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center;
    }
    .hero-cta-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-vt);
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-dim);
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s;
    }
    .hero-cta-ghost:hover { color: var(--green-mid); border-color: var(--border-hi); }
    .hero-cta-ghost svg { width: 16px; height: 16px; }

    /* ══════════════════════════════════════════
       EDITOR WINDOW
    ══════════════════════════════════════════ */
    .editor-section {
      padding: 0 32px 100px;
      position: relative; z-index: 1;
    }

    .editor-window {
      max-width: 980px;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 0 60px rgba(74,222,128,0.08),
        0 32px 80px rgba(0,0,0,0.8);
    }

    .editor-chrome {
      height: 36px;
      background: rgba(10,12,18,0.99);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
    }
    .chrome-dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .chrome-dot--red    { background: #ff5f57; }
    .chrome-dot--yellow { background: #febc2e; }
    .chrome-dot--green  { background: #28c840; }
    .chrome-title {
      flex: 1; text-align: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: rgba(180,190,210,0.25);
      letter-spacing: 0.1em;
    }

    .editor-video {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg-mid);
    }

    /* ══════════════════════════════════════════
       SECTION SHARED
    ══════════════════════════════════════════ */
    section {
      padding: 100px 0;
      position: relative; z-index: 1;
    }
    section .container > .eyebrow { margin-bottom: 12px; }
    .section-heading {
      font-family: var(--font-vt);
      font-size: clamp(36px, 5vw, 56px);
      color: var(--text-hi);
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .section-sub {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 480px;
      margin-bottom: 60px;
    }

    /* ══════════════════════════════════════════
       FEATURES
    ══════════════════════════════════════════ */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .feature-card {
      background: var(--bg-card);
      padding: 32px 28px;
      transition: background 0.2s;
    }
    .feature-card:hover { background: #1e2130; }

    .feature-icon {
      font-family: var(--font-vt);
      font-size: 32px;
      color: var(--green);
      line-height: 1;
      margin-bottom: 18px;
      display: block;
      text-shadow: 0 0 12px rgba(74,222,128,0.5);
    }

    .feature-title {
      font-family: var(--font-vt);
      font-size: 22px;
      color: var(--text-hi);
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .feature-desc {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-mid);
      line-height: 1.75;
    }

    /* ══════════════════════════════════════════
       SCREENSHOTS STRIP
    ══════════════════════════════════════════ */
    .screenshots-section {
      padding: 0 0 100px;
      overflow: hidden;
      position: relative; z-index: 1;
    }
    .screenshots-track {
      display: flex;
      gap: 16px;
      padding: 0 32px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .screenshot-card {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .screenshot-card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .screenshot-label {
      padding: 10px 14px 9px;
      background: rgba(10,12,20,0.9);
      font-family: var(--font-vt);
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    /* ══════════════════════════════════════════
       EXPORT
    ══════════════════════════════════════════ */
    .export-section { background: #0e1018; }
    .export-section .container {
      display: flex; gap: 80px; align-items: flex-start;
    }
    .export-left { flex: 1; }
    .export-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }

    .framework-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      transition: border-color 0.15s, background 0.15s;
      cursor: default;
    }
    .framework-row:hover {
      border-color: var(--border-hi);
      background: #1e2130;
    }

    .fw-name {
      font-family: var(--font-vt);
      font-size: 22px;
      color: var(--text-hi);
      letter-spacing: 0.06em;
    }
    .fw-lang {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 10px 2px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .fw-lang--ts  { color: #67e8f9; border-color: rgba(103,232,249,0.35); background: rgba(103,232,249,0.06); }
    .fw-lang--go  { color: #86efac; border-color: rgba(134,239,172,0.35); background: rgba(134,239,172,0.06); }
    .fw-lang--js  { color: #fde68a; border-color: rgba(253,230,138,0.35); background: rgba(253,230,138,0.06); }
    .fw-lang--py  { color: #c4b5fd; border-color: rgba(196,181,253,0.35); background: rgba(196,181,253,0.06); }

    /* ══════════════════════════════════════════
       COMPONENTS
    ══════════════════════════════════════════ */
    .components-terminal {
      border: 1px solid rgba(255,255,255,0.10);
      background: var(--bg-card);
      max-width: 780px;
      margin: 0 auto;
    }
    .term-titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px 9px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(10,12,20,0.6);
      font-family: var(--font-vt);
      font-size: 15px;
      letter-spacing: 0.18em;
      color: var(--green-dim);
    }
    .term-titlebar-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(74,222,128,0.8);
      animation: blink-dot 2s ease-in-out infinite;
    }
    .components-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .comp-item {
      padding: 11px 16px 10px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-family: var(--font-vt);
      font-size: 18px;
      color: var(--text-mid);
      letter-spacing: 0.08em;
      transition: color 0.12s, background 0.12s;
      display: flex; align-items: center; gap: 8px;
      cursor: default;
    }
    .comp-item:hover { color: var(--text-hi); background: rgba(255,255,255,0.04); }
    .comp-item::before { content: '›'; color: var(--text-dim); flex-shrink: 0; }
    .comp-item:nth-child(4n) { border-right: none; }

    /* ══════════════════════════════════════════
       FINAL CTA
    ══════════════════════════════════════════ */
    .cta-section {
      text-align: center;
      padding: 120px 32px;
      position: relative; z-index: 1;
    }
    .cta-section .section-heading {
      margin-bottom: 12px;
    }
    .cta-section .section-sub {
      margin: 0 auto 48px;
      text-align: center;
    }

    /* ══════════════════════════════════════════
       ANSI CANVAS LOGO
    ══════════════════════════════════════════ */
    .ansi-logo-wrap {
      max-width: 790px;
      margin: 0 auto;
      padding: 0 24px;
    }
    #ansiCanvas {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      display: block;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.55)) drop-shadow(0 0 14px rgba(74,222,128,0.30));
      animation: ansi-pulse 4s ease-in-out infinite;
    }
    @keyframes ansi-pulse {
      0%,100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.55)) drop-shadow(0 0 14px rgba(74,222,128,0.30)); }
      50%      { filter: drop-shadow(0 0 7px rgba(255,255,255,0.80)) drop-shadow(0 0 22px rgba(74,222,128,0.50)); }
    }

    /* ══════════════════════════════════════════
       FAQ
    ══════════════════════════════════════════ */
    .faq-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .faq-item {
      border: 1px solid var(--border);
      background: var(--bg-card);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .faq-item.is-open {
      border-color: rgba(74,222,128,0.25);
    }

    .faq-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px 14px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .faq-trigger:hover { background: rgba(255,255,255,0.04); }
    .faq-trigger:hover .faq-question { color: #ffffff; }
    .faq-trigger:hover .faq-icon { color: var(--green-mid); }

    .faq-question {
      font-family: var(--font-vt);
      font-size: 20px;
      color: var(--text-hi);
      letter-spacing: 0.05em;
      line-height: 1.2;
      transition: color 0.15s;
    }

    .faq-icon {
      font-family: var(--font-vt);
      font-size: 20px;
      color: var(--green-dim);
      flex-shrink: 0;
      white-space: nowrap;
      transition: color 0.15s;
      min-width: 48px;
      text-align: right;
    }
    .faq-item.is-open .faq-icon { color: var(--green); }

    .faq-body {
      display: none;
      padding: 0 20px 18px;
      border-top: 1px solid var(--border);
    }
    .faq-item.is-open .faq-body { display: block; }

    .faq-answer {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.8;
      padding-top: 14px;
    }

    .faq-answer p { margin-bottom: 10px; }
    .faq-answer p:last-child { margin-bottom: 0; }

    .faq-platform {
      display: inline-block;
      font-family: var(--font-vt);
      font-size: 15px;
      letter-spacing: 0.12em;
      padding: 1px 8px 0;
      margin-bottom: 4px;
      border: 1px solid;
    }
    .faq-platform--mac  { color: #67e8f9; border-color: rgba(103,232,249,0.30); background: rgba(103,232,249,0.05); }

  <script>
    /* ── ASCII plasma background ── */
    (function () {
      const canvas = document.getElementById('ascii-bg');
      const ctx    = canvas.getContext('2d');

      const FS = 14;          /* font size / row height */
      const CW = FS * 0.62;   /* column width (monospace ratio) */

      /* Density ramp — space = empty, █ = full */
      const CHARS = ' ·.:;+|*#%@█';

      let t = 0;
      let W, H, cols, rows;

      /* plasma value at grid cell (c, r) — returns -1 … 1 */
      function plasma(c, r) {
        const x = c * 0.18;
        const y = r * 0.22;
        const cx = cols * 0.09;
        const cy = rows * 0.11;
        const d  = Math.sqrt((c - cx) * (c - cx) + (r - cy) * (r - cy));
        return (
          Math.sin(x + t) +
          Math.sin(y + t * 0.7) +
          Math.sin((x + y) * 0.6 + t * 0.9) +
          Math.sin(d * 0.28 + t * 1.1)
        ) / 4; /* -1 … 1 */
      }

      /* top-to-bottom vignette: full at top, gone by ~80% */
      function vignette(r) {
        const ratio = r / rows;
        return Math.max(0, Math.min(1, 1 - (ratio - 0.35) / 0.45));
      }

      function init() {
        canvas.width  = W = canvas.offsetWidth;
        canvas.height = H = canvas.offsetHeight;
        cols = Math.floor(W / CW);
        rows = Math.floor(H / FS);
        ctx.font = `${FS}px 'SF Mono','Fira Code',Consolas,monospace`;
      }

      function frame() {
        ctx.clearRect(0, 0, W, H);
        ctx.font = `${FS}px 'SF Mono','Fira Code',Consolas,monospace`;

        for (let r = 0; r < rows; r++) {
          const vig = vignette(r);
          if (vig < 0.008) continue;

          for (let c = 0; c < cols; c++) {
            const v    = plasma(c, r);          /* -1 … 1   */
            const norm = (v + 1) / 2;           /*  0 … 1   */
            const idx  = Math.floor(norm * (CHARS.length - 1));
            const ch   = CHARS[idx];
            if (ch === ' ') continue;

            /* opacity peaks at mid-values, falls off at extremes */
            const intensity = Math.sin(norm * Math.PI); /* 0→1→0  */
            const op = intensity * 0.55 * vig;
            if (op < 0.006) continue;

            ctx.fillStyle = `rgba(74,222,128,${op.toFixed(3)})`;
            ctx.fillText(ch, c * CW, (r + 1) * FS);
          }
        }

        t += 0.016;
        requestAnimationFrame(frame);
      }

      init();
      window.addEventListener('resize', init);
      frame();
    })();
  </script>
